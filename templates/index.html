<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İsim Ekle</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      color: #2f3640;
      margin-bottom: 20px;
    }

    form {
      background-color: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 300px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    button {
      background-color: #00a8ff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0097e6;
    }

    a {
      margin-top: 15px;
      color: #273c75;
      text-decoration: none;
      font-size: 14px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h2>Yeni İsim Ekle</h2>
  <form method="POST">
    <input type="text" name="name" placeholder="İsmini yaz..." required>
    <button type="submit">Kaydet</button>
  </form>
  <a href="/list">Kaydedilen İsimleri Gör</a>
</body>
</html>
