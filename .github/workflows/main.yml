name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      # Repo'yu checkout et
      - name: Checkout repository
        uses: actions/checkout@v3

      # Python kur
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      # Dependencies yükle
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Testleri çalıştır
      - name: Run tests
        run: python -m unittest discover || echo "No tests found"

      # Docker image build et
      - name: Build Docker image
        run: docker build -t mini-web-app .

      # Railway deploy (web deploy token kullan)
      - name: Deploy to Railway
        run: |
            npm install -g @railway/cli
            railway up
        env:
            RAILWAY_TOKEN: ${{ secrets.RailwayDeployToken }}


         